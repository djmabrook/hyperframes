<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Film strip opening</title>
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e2ded6;
      }
      #root {
        position: absolute;
        inset: 0;
        background: #e2ded6;
      }
      #fs-glow,
      #fs-vignette {
        position: absolute;
        inset: 0;
      }
      #fs-glow {
        background: radial-gradient(ellipse at 55% 45%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%);
      }
      #fs-vignette {
        background: linear-gradient(90deg, #141312 0%, #141312 10%, rgba(120, 104, 84, 0.55) 14%, rgba(226, 222, 214, 0) 34%);
      }
      #fs-canvas {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <!-- The site's opening, played through over 12 s (the page plays it from scroll).
         Same scene module as the website; this host maps timeline time to p. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="fs-glow"></div>
      <div id="fs-vignette"></div>
      <canvas id="fs-canvas" width="1920" height="1080"></canvas>
    </div>
    <script type="module">
      import { createFilmstrip, backgroundAt } from "./scene.js";

      const DURATION = 12;
      const strip = createFilmstrip({ canvas: document.getElementById("fs-canvas") });
      strip.setSize(1920, 1080);
      const root = document.getElementById("root");
      const glow = document.getElementById("fs-glow");
      const vignette = document.getElementById("fs-vignette");

      // A paused GSAP timeline is the clock: seeking it draws the frame for that time.
      const clock = { t: 0 };
      function draw() {
        const p = Math.min(1, clock.t / 10);
        const bg = backgroundAt(p);
        root.style.background = bg.color;
        glow.style.opacity = bg.glow;
        vignette.style.opacity = bg.vignette;
        strip.render(p, clock.t, 0);
      }
      draw();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: draw }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
