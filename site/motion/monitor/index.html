<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024, height=576" />
    <title>Program monitor</title>
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <!-- The HyperFrames runtime, loaded here so the site's player can deliver runtime data
         (the grade and cue channels); the player only injects it on its own for compositions
         it can't drive directly. The CLI's preview and render bring their own. -->
    <script src="assets/vendor/hyperframes-runtime-0.8.198.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1024px;
        height: 576px;
        overflow: hidden;
        background: #050506;
      }
      #root {
        position: absolute;
        inset: 0;
        background: #050506;
      }
      #picture {
        position: absolute;
        inset: 0;
        width: 1024px;
        height: 576px;
      }
    </style>
  </head>
  <body>
    <!-- The program monitor picture on the site's workspace: the dusk horizon with its glowing
         waveform, recorded left to right as the playhead crosses it. The site plays this with
         <hyperframes-player>, scrubs it from the timeline playhead (seek), and grades it from the
         colour wheels over the "grade" runtime-data channel, and cues Work bin projects over "cue". The look matches the fallback
         shader in ../workspace/scene.js, which the site uses when this can't load. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1024" data-height="576">
      <canvas id="picture" width="1024" height="576"></canvas>
    </div>
    <script type="module">
      const DURATION = 20;
      const canvas = document.getElementById("picture");
      // preserveDrawingBuffer: the site samples this canvas as a texture between draws.
      const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });

      const FRAG = `
        precision highp float;
        uniform vec2 uRes;
        uniform float uTime;
        uniform float uPlay;
        uniform vec3 uLift;
        uniform vec3 uGamma;
        uniform vec3 uGain;
        uniform vec3 uOffset;
        uniform vec3 uTint;
        uniform float uTintMix;
        uniform float uSeed;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

        vec3 dusk(vec2 uv) {
          float horizon = 0.47 + (uv.x - 0.5) * 0.07;
          float d = uv.y - horizon;
          vec3 sky = mix(vec3(0.90, 0.82, 0.86), vec3(0.42, 0.55, 0.84), smoothstep(0.0, 0.12, d));
          sky = mix(sky, vec3(0.10, 0.17, 0.46), smoothstep(0.12, 0.6, d));
          sky += vec3(0.30, 0.10, 0.08) * exp(-abs(d) * 30.0) * smoothstep(0.3, 1.0, uv.x);
          vec3 ground = mix(vec3(0.16, 0.16, 0.40), vec3(0.03, 0.04, 0.13), smoothstep(0.0, -0.35, d));
          float lights = 0.0;
          for (int i = 0; i < 3; i++) {
            float fi = float(i);
            vec2 g = vec2(uv.x * (70.0 + fi * 45.0) + uTime * 0.15, uv.y * (220.0 + fi * 90.0));
            vec2 id = floor(g);
            vec2 f = fract(g) - 0.5;
            float n = hash(id + fi * 17.0);
            vec2 off = vec2(hash(id + 3.1), hash(id + 7.7)) - 0.5;
            float dist = length((f - off * 0.6) * vec2(0.45, 1.0));
            float on = step(0.8, n) * (0.55 + 0.45 * sin(uTime * 1.5 + n * 50.0));
            lights += on * smoothstep(0.32, 0.0, dist) * (1.0 - fi * 0.25);
          }
          float band = smoothstep(0.0, -0.025, d) * (1.0 - smoothstep(-0.08, -0.55, d) * 0.7);
          ground += vec3(1.0, 0.38, 0.24) * lights * band * 1.1;
          ground += vec3(0.75, 0.35, 0.5) * exp(-abs(d) * 20.0) * 0.3;
          return d > 0.0 ? sky : ground;
        }

        float waveAt(vec2 uv, float shift) {
          float x = uv.x + shift;
          float horizon = 0.455 + (x - 0.5) * 0.07;
          float c = (uSeed - 0.5) * 0.3; // each cued clip has its own waveform
          float env = exp(-pow((x - 0.47 - c) / 0.13, 2.0)) * 0.11 + exp(-pow((x - 0.62 + c * 0.6) / 0.06, 2.0)) * 0.06 + 0.006;
          float col = floor(x * 520.0);
          float h = env * (0.25 + 0.75 * hash(vec2(col, floor(uTime * 12.0))));
          float dy = abs(uv.y - horizon);
          float line = step(dy, h) * (0.55 + 0.45 * hash(vec2(col, 3.0)));
          float glow = exp(-dy / (env * 0.7 + 0.003)) * 0.5;
          float recorded = smoothstep(uPlay + 0.003, uPlay - 0.02, x);
          return (line * 0.9 + glow) * mix(0.18, 1.0, recorded);
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uRes;
          vec3 col = dusk(uv);
          col += vec3(0.55, 0.62, 1.0) * vec3(waveAt(uv, 0.0025) * 0.8, waveAt(uv, 0.0), waveAt(uv, -0.0025) * 1.25);
          col += vec3(0.6, 0.95, 1.0) * exp(-abs(uv.x - uPlay) * 900.0) * 0.9;
          // A cued clip takes on its bin label colour.
          col = mix(col, col * (0.45 + uTint * 0.9), uTintMix);
          // Primaries, as on the colour page: lift, gamma, gain, offset.
          col = clamp(col, 0.0, 1.0);
          col = col * uGain + uLift * (1.0 - col);
          col = pow(max(col, 0.0), 1.0 / uGamma);
          col += uOffset;
          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `;

      const shader = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, shader(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
      gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const u = (name) => gl.getUniformLocation(prog, name);
      gl.uniform2f(u("uRes"), canvas.width, canvas.height);

      // Neutral grade until the page sends one.
      const grade = { lift: [0, 0, 0], gamma: [1, 1, 1], gain: [1, 1, 1], offset: [0, 0, 0] };
      const cue = { tint: [1, 1, 1], mix: 0, seed: 0.5 };
      const clock = { t: 0 };
      const draw = () => {
        gl.uniform1f(u("uTime"), clock.t);
        gl.uniform1f(u("uPlay"), 0.04 + 0.92 * (clock.t / DURATION));
        gl.uniform3fv(u("uLift"), grade.lift);
        gl.uniform3fv(u("uGamma"), grade.gamma);
        gl.uniform3fv(u("uGain"), grade.gain);
        gl.uniform3fv(u("uOffset"), grade.offset);
        gl.uniform3fv(u("uTint"), cue.tint);
        gl.uniform1f(u("uTintMix"), cue.mix);
        gl.uniform1f(u("uSeed"), cue.seed);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
      draw();

      // A paused GSAP timeline is the clock: seeking it draws the frame for that time.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: draw }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // Grades arrive from the page; redraw the current frame so a paused picture still updates.
      const listen = () => {
        if (!window.__hyperframes?.registerRuntimeDataHandler) return setTimeout(listen, 50);
        window.__hyperframes.registerRuntimeDataHandler("grade", (g) => {
          for (const k of Object.keys(grade)) if (Array.isArray(g?.[k]) && g[k].length === 3) grade[k] = g[k].map(Number);
          draw();
        });
        // A project hovered in the site's Work bin: its label colour and waveform.
        window.__hyperframes.registerRuntimeDataHandler("cue", (c) => {
          if (Array.isArray(c?.tint) && c.tint.length === 3) cue.tint = c.tint.map(Number);
          if (Number.isFinite(c?.mix)) cue.mix = c.mix;
          if (Number.isFinite(c?.seed)) cue.seed = c.seed;
          draw();
        });
      };
      listen();
    </script>
  </body>
</html>
