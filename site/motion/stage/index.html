<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Stage</title>
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #100f0d;
      }
      #root {
        position: absolute;
        inset: 0;
        background: #100f0d;
      }
      #stage-canvas {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <!-- The site's 3D stage played as a scroll-through, top to bottom over 20 s.
         Same scene module the page runs live; this host maps timeline time to scroll position. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="stage-canvas" width="1920" height="1080"></canvas>
    </div>

    <script type="module">
      import { createStage, SECTIONS, THREE } from "./scene.js";

      const DURATION = 20;
      const texture = new THREE.Texture();
      const loaded = new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          texture.image = img;
          texture.needsUpdate = true;
          resolve();
        };
        img.onerror = resolve;
        img.src = "assets/placeholder-poster.jpg";
      });

      const stage = createStage({ canvas: document.getElementById("stage-canvas"), texture });
      stage.setSize(1920, 1080);

      // A paused GSAP timeline is the clock: seeking it draws the frame for that time.
      loaded.then(() => {
        const clock = { t: 0 };
        const draw = () => stage.renderAt((clock.t / DURATION) * (SECTIONS - 1), clock.t, 1);
        draw();
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(clock, { t: 0 }, { t: DURATION, duration: DURATION, ease: "none", onUpdate: draw }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
