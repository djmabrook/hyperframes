<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"first","type":"string","label":"First name","default":"Mohamed"},
    {"id":"last","type":"string","label":"Last name","default":"Elsafty"},
    {"id":"role","type":"string","label":"Role line","default":"Documentary & Commercial Editor · Brooklyn"},
    {"id":"kicker","type":"string","label":"Kicker","default":"EDITOR · PORTFOLIO"},
    {"id":"ground","type":"color","label":"Ground","default":"#100f0d"},
    {"id":"ink","type":"color","label":"Ink","default":"#efe9df"},
    {"id":"accent","type":"color","label":"Accent","default":"#e8a33d"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Opener</title>
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-weight: 300;
        font-style: normal;
        src: url("assets/fonts/fraunces-latin-300-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-weight: 300;
        font-style: italic;
        src: url("assets/fonts/fraunces-latin-300-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 500;
        src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground, #100f0d);
      }
      /* On the website the 3D stage shows through: index.html?embed */
      html.embed,
      html.embed body,
      html.embed #root {
        background: transparent;
      }
      #root {
        position: absolute;
        inset: 0;
        background: var(--ground, #100f0d);
        color: var(--ink, #efe9df);
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 28px;
        letter-spacing: 0.16em;
        color: #8b857b;
      }

      /* Header row, inside title-safe. */
      #op-kicker {
        position: absolute;
        left: 192px;
        top: 150px;
      }
      #op-timecode {
        position: absolute;
        right: 192px;
        top: 150px;
        font-variant-numeric: tabular-nums;
        color: var(--accent, #e8a33d);
      }

      /* Name is wiped on by the playhead; the role line lands after it. */
      #op-name {
        position: absolute;
        left: 180px;
        top: 200px;
        font-family: "Fraunces", serif;
        font-weight: 300;
        font-size: 210px;
        line-height: 0.98;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      #op-role {
        position: absolute;
        left: 192px;
        top: 640px;
        font-family: "Fraunces", serif;
        font-style: italic;
        font-weight: 300;
        font-size: 60px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      /* Three-track timeline: V2, V1, A1. */
      #op-timeline {
        position: absolute;
        left: 120px;
        right: 192px;
        top: 800px;
        height: 150px;
      }
      .op-track {
        position: absolute;
        left: 72px;
        right: 0;
        height: 38px;
        border-top: 1px solid #2b2925;
      }
      .op-label {
        position: absolute;
        left: -72px;
        top: 8px;
        font-size: 18px;
      }
      .op-clip {
        position: absolute;
        top: 4px;
        height: 30px;
        background: #3a3630;
        border-left: 2px solid #5d564b;
      }
      #op-a1 .op-clip {
        background: #25303a;
        border-left-color: #3f5262;
      }
      #op-playhead {
        position: absolute;
        top: -26px;
        left: 72px;
        width: 2px;
        height: 176px;
        background: var(--accent, #e8a33d);
      }
      #op-playhead::before {
        content: "";
        position: absolute;
        left: -9px;
        top: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 14px solid var(--accent, #e8a33d);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="op-kicker" class="mono" data-var-text="kicker">EDITOR · PORTFOLIO</div>
      <div id="op-timecode" class="mono">01:00:00:00</div>
      <h1 id="op-name"><span id="op-first" data-var-text="first">Mohamed</span><br /><span id="op-last" data-var-text="last">Elsafty</span></h1>
      <p id="op-role" data-var-text="role">Documentary &amp; Commercial Editor · Brooklyn</p>

      <div id="op-timeline" data-layout-allow-overflow>
        <div id="op-v2" class="op-track" style="top: 0"><span class="op-label mono" data-layout-ignore>V2</span></div>
        <div id="op-v1" class="op-track" style="top: 50px"><span class="op-label mono" data-layout-ignore>V1</span></div>
        <div id="op-a1" class="op-track" style="top: 100px"><span class="op-label mono" data-layout-ignore>A1</span></div>
        <div id="op-playhead"></div>
      </div>
    </div>

    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

        // Edit decision list: [track, start, length] in pixels along a 1536px-wide track.
        const TRACK_W = 1536;
        const EDL = [
          ["v1", 0, 210], ["v1", 214, 96], ["v1", 314, 260], ["v1", 578, 140], ["v1", 722, 330],
          ["v1", 1056, 118], ["v1", 1178, 358],
          ["v2", 150, 120], ["v2", 520, 70], ["v2", 880, 150], ["v2", 1240, 90],
          ["a1", 0, 574], ["a1", 590, 462], ["a1", 1068, 468],
        ];
        const clips = EDL.map(([track, x, w]) => {
          const el = document.createElement("div");
          el.className = "op-clip";
          el.style.left = x + "px";
          el.style.width = w + "px";
          document.getElementById("op-" + track).appendChild(el);
          return { el, x, w };
        });

        const nameEl = document.getElementById("op-name");
        const playhead = document.getElementById("op-playhead");
        const timecode = document.getElementById("op-timecode");
                const pad = (n) => String(n).padStart(2, "0");

        // Everything the playhead touches is a pure function of its position p (0..1).
        function drawEdit(p) {
          const x = p * TRACK_W;
          playhead.style.transform = `translateX(${x}px)`;
          for (const c of clips) {
            const shown = Math.max(0, Math.min(c.w, x - c.x));
            c.el.style.clipPath = `inset(0 ${c.w - shown}px 0 0)`;
          }
          const reveal = Math.max(0, x); // the wipe edge trails the playhead by 12px
          nameEl.style.clipPath = `inset(-20% calc(100% - ${reveal}px) -20% 0)`;
        }

        // Timecode reads like a record monitor at 24 fps, starting at 01:00:00:00.
        function drawTimecode(t) {
          const f = Math.floor(t * 24 + 1e-6);
          timecode.textContent = `01:00:${pad(Math.floor(f / 24))}:${pad(f % 24)}`;
        }

        const tl = gsap.timeline({ paused: true });
        const edit = { p: 0 };
        const clock = { t: 0 };
        drawEdit(0);

        tl.fromTo(clock, { t: 0 }, { t: 7, duration: 7, ease: "none", onUpdate: () => drawTimecode(clock.t) }, 0);
        tl.fromTo(["#op-kicker", "#op-timecode"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);
        tl.fromTo("#op-timeline", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.3);
        tl.fromTo(edit, { p: 0 }, { p: 1, duration: 2.8, ease: "power2.inOut", onUpdate: () => drawEdit(edit.p) }, 0.7);
        tl.fromTo(
          "#op-role",
          { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
          3.4,
        );
        // The edit steps back so the title holds the frame.
        tl.fromTo("#op-timeline", { opacity: 1 }, { opacity: 0.35, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 4.2);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
