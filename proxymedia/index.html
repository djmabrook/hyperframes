<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxy Media</title>
    <link rel="preload" as="image" href="media/poster.webp" />
    <link rel="stylesheet" href="sections/sections.css" />
    <style>
      :root {
        --wall: #e4ddd5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background: var(--wall);
      }
      html {
        /* One soft catch where the punch lands, so a scroll that ends near the
           TV settles on it and the program can play. Pushing on carries past. */
        scroll-snap-type: y proximity;
      }
      body {
        background: var(--wall);
      }
      /* The landing's scroll length drives the sequence; the stage stays pinned
         while it scrolls. Markers (below) split it into the 14 s camera move,
         the hold on the TV, the resistance before power-off, the unspool, and
         the pull-back once the tape has fallen past the TV. */
      #landing {
        position: relative;
        height: 1360vh;
      }
      .mark {
        position: absolute;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      #mark-tv {
        top: 800vh;
        scroll-snap-align: start;
      }
      #mark-strain {
        top: 850vh;
      }
      #mark-off {
        top: 920vh;
      }
      #mark-unspool-end {
        top: 1120vh;
      }
      #mark-pull-end {
        top: 1260vh;
      }
      #stage {
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        background: var(--wall);
      }
      /* The tape hangs in its own fixed layer, above the stage and whatever
         scrolls in after the landing (it dangles over the next wall), under
         the vignette and grain. tape-ribbons.js scrolls it away when that
         section leaves. */
      #tape {
        position: fixed;
        z-index: 40;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        height: 100svh;
        pointer-events: none;
        visibility: hidden;
      }
      #tape.live {
        visibility: visible;
      }
      #frame {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      #frame > * {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #poster {
        object-fit: cover;
        transition: opacity 0.4s ease;
      }
      #frame.ready #poster {
        opacity: 0;
      }
      hyperframes-player {
        display: block;
        pointer-events: none;
      }
      /* Narrow screens show more of the frame than fits; the frame dissolves into the wall. */
      #frame.letterbox {
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0,
          #000 9%,
          #000 91%,
          transparent 100%
        );
        mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%);
      }
      /* Warm falloff and live film grain over everything. */
      #vignette {
        position: fixed;
        z-index: 50;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(0, 0, 0, 0) 55%,
          rgba(58, 36, 16, 0.22) 100%
        );
        mix-blend-mode: multiply;
      }
      #grain {
        background-image: url("media/grain.svg");
        background-size: 180px 180px;
        position: fixed;
        inset: -2px;
        width: calc(100% + 4px);
        height: calc(100% + 4px);
        z-index: 50;
        pointer-events: none;
        opacity: 0.055;
        mix-blend-mode: overlay;
      }
      #site-content {
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100dvh;
        margin-top: -100vh;
        margin-top: -100dvh;
        z-index: 2;
        pointer-events: none;
        opacity: var(--screen-progress, 0);
      }
      body[data-sequence-complete="true"] #site-content {
        pointer-events: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #grain {
          opacity: 0.1;
        }
      }
    </style>
  </head>
  <body>
    <div id="landing">
      <div class="mark" id="mark-tv"></div>
      <div class="mark" id="mark-strain"></div>
      <div class="mark" id="mark-off"></div>
      <div class="mark" id="mark-unspool-end"></div>
      <div class="mark" id="mark-pull-end"></div>
      <div id="stage" aria-hidden="true">
        <div id="frame">
          <img id="poster" src="media/poster.webp" alt="" />
        </div>
      </div>
      <main id="site-content" aria-label="Proxy Media">
        <!-- Future site content lives here after the screen fills the viewport. -->
      </main>
    </div>
    <section id="notes" class="scene" aria-label="Projects">
      <div class="scene-view">
        <div class="nt-plate" aria-hidden="true">
          <img class="nt-wall" src="sections/media/wall-blank.webp" alt="" />
          <img class="nt-line" src="sections/media/wall-line-0.webp" alt="" style="left: 1148px; top: 698px; width: 259px; height: 87px" />
          <img class="nt-line" src="sections/media/wall-line-1.webp" alt="" style="left: 1171px; top: 799px; width: 292px; height: 86px" />
          <img class="nt-line" src="sections/media/wall-line-2.webp" alt="" style="left: 1151px; top: 898px; width: 261px; height: 87px" />
          <img class="nt-line" src="sections/media/wall-line-3.webp" alt="" style="left: 2027px; top: 1060px; width: 253px; height: 86px" />
          <img class="nt-line" src="sections/media/wall-line-4.webp" alt="" style="left: 2046px; top: 1158px; width: 289px; height: 87px" />
          <img class="nt-line" src="sections/media/wall-line-5.webp" alt="" style="left: 1328px; top: 1359px; width: 199px; height: 87px" />
        </div>
      </div>
      <div class="visually-hidden">
        <h2>In Development</h2>
        <ul>
          <li>AI Psychosis Doc</li>
          <li>Bodega Guy Short</li>
        </ul>
        <h2>In Production</h2>
        <ul>
          <li>Nick County music vid</li>
        </ul>
        <h2>Out Now</h2>
      </div>
    </section>
    <section id="mailbox" class="scene" aria-label="Contact">
      <div class="scene-view">
        <div class="mb-plate" aria-hidden="true">
          <img class="mb-photo" src="sections/media/mailbox-open.webp" alt="" />
          <div class="mb-door">
            <img class="mb-door-front" src="sections/media/mailbox-door-front.webp" alt="" />
            <img class="mb-door-back" src="sections/media/mailbox-door-back.webp" alt="" />
          </div>
        </div>
        <div class="mb-dim" aria-hidden="true"></div>
        <form
          class="mb-form"
          name="contact"
          method="POST"
          action="/"
          data-netlify="true"
          netlify-honeypot="bot-field"
        >
          <input type="hidden" name="form-name" value="contact" />
          <p class="mb-hp">
            <label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
          </p>
          <label class="mb-field">
            <span>Name</span>
            <input name="name" type="text" autocomplete="name" required />
          </label>
          <label class="mb-field">
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label class="mb-field">
            <span>Message</span>
            <textarea name="message" rows="4" required></textarea>
          </label>
          <div class="mb-actions">
            <button type="submit">Send</button>
            <output class="mb-status" aria-live="polite"></output>
          </div>
        </form>
      </div>
    </section>
    <canvas id="tape" aria-hidden="true"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>
    <script src="vendor/hyperframes-player-0.8.198.js" defer></script>
    <script src="scroll.js" defer></script>
    <script type="module" src="tape/tape-ribbons.js"></script>
    <script src="sections/notes.js" defer></script>
    <script src="sections/mailbox.js" defer></script>
  </body>
</html>
