<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxy Media</title>
    <link rel="preload" as="image" href="media/poster.webp" />
    <style>
      :root {
        --wall: #e4ddd5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background: var(--wall);
      }
      body {
        background: var(--wall);
        /* The scroll length drives the sequence; nothing else lives on the page yet. */
        height: 900svh;
        height: 900vh;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--wall);
      }
      #frame {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      #frame > * {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #poster {
        object-fit: cover;
        transition: opacity 0.4s ease;
      }
      #frame.ready #poster {
        opacity: 0;
      }
      hyperframes-player {
        display: block;
        pointer-events: none;
      }
      /* Narrow screens show more of the frame than fits; the frame dissolves into the wall. */
      #frame.letterbox {
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0,
          #000 9%,
          #000 91%,
          transparent 100%
        );
        mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%);
      }
      /* Warm falloff and live film grain over everything. */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(0, 0, 0, 0) 55%,
          rgba(58, 36, 16, 0.22) 100%
        );
        mix-blend-mode: multiply;
      }
      #grain {
        background-image: url("media/grain.svg");
        background-size: 180px 180px;
        position: fixed;
        inset: -2px;
        width: calc(100% + 4px);
        height: calc(100% + 4px);
        pointer-events: none;
        opacity: 0.055;
        mix-blend-mode: overlay;
      }
      #site-content {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: var(--screen-progress, 0);
      }
      body[data-sequence-complete="true"] #site-content {
        pointer-events: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #grain {
          opacity: 0.1;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true">
      <div id="frame">
        <img id="poster" src="media/poster.webp" alt="" />
      </div>
      <div id="vignette"></div>
      <div id="grain"></div>
    </div>
    <main id="site-content" aria-label="Proxy Media">
      <!-- Future site content lives here after the screen fills the viewport. -->
    </main>
    <script src="vendor/hyperframes-player-0.8.198.js" defer></script>
    <script src="scroll.js" defer></script>
  </body>
</html>
