<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Proxy Media landing</title>
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e4ddd5;
      }
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #e4ddd5;
      }
      #zoom,
      #cam,
      #rig {
        position: absolute;
        inset: 0;
      }
      #zoom {
        transform-origin: 0 0;
      }
      /* The camera. perspective is the focal length in pixels; the rig pivots on the lens. */
      #cam {
        perspective: 1888px;
        perspective-origin: 50% 50%;
      }
      #rig {
        transform-style: preserve-3d;
      }
      /* Each shot is a wall facing the lens, 1920 x 1080 (4K frames at half scale). */
      .plane {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        backface-visibility: hidden;
      }
      .plane img,
      .plane .clip {
        position: absolute;
        display: block;
      }
      .full {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      /* Bleed: each wall continues past its frame with mirrored copies of itself (built by
         the script below), so the frame never shows an edge while the camera pivots and walls
         meet between shots. */
      .bleed {
        position: absolute;
        overflow: hidden;
        pointer-events: none;
      }
      .bleed img {
        position: absolute;
      }
      #insert {
        /* The slot's lower lip: the tape disappears above this line as it goes in. */
        left: 0;
        top: 533.5px;
        width: 1920px;
        height: 420px;
        overflow: hidden;
      }
      #flyer {
        position: absolute;
        left: 647px;
        top: 335.5px;
        width: 630.5px;
        height: 369px;
        opacity: 0;
      }
      #flyer-b {
        /* The tape as photographed at the VCR, at its settle pose; takes over from the flyer. */
        position: absolute;
        left: 602px;
        top: 549.5px;
        width: 694px;
        height: 230px;
        transform: scale(1.02);
        transform-origin: 50% 0;
        opacity: 0;
      }
      #tv-screen {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
        /* frame 7 registered onto frame 6 (SIFT, 21 inliers) */
        transform: translate(647.05px, 314.5px) rotate(0.42deg) scale(0.32362);
        opacity: 0;
      }
      /* TBA: the rest of the site will live inside the TV screen. Empty on purpose. */
      #tv-content {
        position: absolute;
        left: 236px;
        top: 70px;
        width: 1448px;
        height: 930px;
        border-radius: 70px;
        border: 3px dashed rgba(255, 255, 255, 0.4);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="zoom">
        <div id="cam">
          <div id="rig">
            <!-- Frame 1: the tape on the white wall, "Brooklyn, NY 2026" beneath it. -->
            <div class="plane" id="plane-wall" data-bleed="assets/img/wall.webp">
              <img class="full" src="assets/img/wall.webp" alt="" />
              <img id="tape01-shadow" src="assets/img/tape01-shadow.webp" alt="" style="left: 564px; top: 297.5px; width: 796.5px; height: 490px" />
              <img id="tape01" src="assets/img/tape01.webp" alt="" style="left: 647px; top: 335.5px; width: 630.5px; height: 369px" />
            </div>
            <!-- Frames 3 to 5: the VCR on the next wall. The tape slides in; the flap closes. -->
            <div class="plane" id="plane-vcr" data-bleed="assets/img/vcr-open.webp">
              <img class="full" src="assets/img/vcr-open.webp" alt="" />
              <img class="full" id="vcr-closed" src="assets/img/vcr-closed.webp" alt="" style="opacity: 0" />
              <img id="tape03-shadow" src="assets/img/tape03-shadow.webp" alt="" style="left: 342px; top: 678px; width: 1014px; height: 388.5px; opacity: 0" />
              <div class="clip" id="insert">
                <img id="tape03" src="assets/img/tape03.webp" alt="" style="left: 602px; top: -0.5px; width: 694px; height: 230px; opacity: 0" />
              </div>
            </div>
            <!-- Frame 6: the Sony Trinitron on the other wall. -->
            <div class="plane" id="plane-tv" data-bleed="assets/img/tv-wall.webp">
              <img class="full" src="assets/img/tv-wall.webp" alt="" />
            </div>
          </div>
        </div>
        <!-- Frame 7: the screen close-up, placed where the screen sits in frame 6. -->
        <img id="tv-screen" src="assets/img/tv-screen.webp" alt="" />
      </div>
      <div id="tv-content" data-placeholder="tba"></div>
      <!-- The tape in flight between walls, in front of the lens. -->
      <img id="flyer" src="assets/img/tape01.webp" alt="" />
      <img id="flyer-b" src="assets/img/tape03.webp" alt="" />
    </div>
    <script>
      const W = 1920,
        H = 1080,
        F = 1888; // focal length in px, matches #cam perspective
      // Camera pivot between walls, in degrees. Each wall faces the lens; at 36 degrees the
      // bled walls meet just outside the frame.
      const TILT_VCR = 36,
        TILT_TV = 36;
      // frame 7 placed on frame 6: translate, rotation (deg), scale
      const SCREEN = { x: 647.05, y: 314.5, r: 0.42, s: 0.32362 };

      // Mirrored bleed around each wall: 3 x 3 copies, flipped so every seam is continuous.
      const BLEED_X = 420,
        BLEED_Y = 160;
      for (const host of document.querySelectorAll("[data-bleed]")) {
        const w = host.offsetWidth,
          h = host.offsetHeight;
        const box = document.createElement("div");
        box.className = "bleed";
        Object.assign(box.style, { left: -BLEED_X + "px", top: -BLEED_Y + "px", width: w + 2 * BLEED_X + "px", height: h + 2 * BLEED_Y + "px" });
        for (const gy of [-1, 0, 1])
          for (const gx of [-1, 0, 1]) {
            if (!gx && !gy) continue;
            const img = document.createElement("img");
            img.src = host.dataset.bleed;
            img.alt = "";
            Object.assign(img.style, {
              left: BLEED_X + gx * w + "px",
              top: BLEED_Y + gy * h + "px",
              width: w + "px",
              height: h + "px",
              transform: `scale(${gx ? -1 : 1}, ${gy ? -1 : 1})`,
            });
            box.appendChild(img);
          }
        host.insertBefore(box, host.firstChild);
      }

      const pivot = `50% 50% ${F}px`;
      gsap.set("#rig", { rotationX: 0, transformOrigin: pivot });
      gsap.set("#plane-wall", { transformOrigin: pivot });
      gsap.set("#plane-vcr", { rotationX: TILT_VCR, transformOrigin: pivot });
      gsap.set("#plane-tv", { rotationX: TILT_VCR + TILT_TV, transformOrigin: pivot });
      gsap.set("#tape01", { transformPerspective: F, transformOrigin: "50% 50%" });

      // Seeking suppresses tween callbacks, so the punch-in is applied from a modifier.
      // Punch-in: z runs 0..1; scale grows exponentially and frame 7's centre is carried to the
      // frame centre, so z = 1 lands exactly on frame 7's framing.
      const zoom = { z: 0 };
      const zoomEl = document.getElementById("zoom");
      const K = 1 / SCREEN.s;
      const rad = (d) => (d * Math.PI) / 180;
      const fx = SCREEN.x + SCREEN.s * (Math.cos(rad(SCREEN.r)) * W / 2 - Math.sin(rad(SCREEN.r)) * H / 2);
      const fy = SCREEN.y + SCREEN.s * (Math.sin(rad(SCREEN.r)) * W / 2 + Math.cos(rad(SCREEN.r)) * H / 2);
      const applyZoom = (z) => {
        const sc = Math.pow(K, z);
        const u = (sc - 1) / (K - 1);
        const a = rad(-SCREEN.r * z);
        const tx = fx + (W / 2 - fx) * u;
        const ty = fy + (H / 2 - fy) * u;
        const c = Math.cos(a) * sc,
          s = Math.sin(a) * sc;
        zoomEl.style.transform = `matrix(${c},${s},${-s},${c},${tx - (c * fx - s * fy)},${ty - (s * fx + c * fy)})`;
        return z;
      };

      const tl = gsap.timeline({ paused: true });

      // A. The tape lifts off the wall; its shadow loosens and fades.
      tl.to("#tape01", { scale: 1.05, y: -6, duration: 0.8, ease: "power2.out" }, 0.6);
      tl.to("#tape01-shadow", { opacity: 0, x: -10, y: 18, duration: 0.9, ease: "power1.in" }, 0.6);

      // B. The camera pivots down to the VCR wall; the tape flies in front of the lens to the slot.
      tl.set("#tape01", { opacity: 0 }, 1.4);
      tl.set("#flyer", { opacity: 1, scale: 1.05, y: -6, transformPerspective: F, transformOrigin: "50% 50%" }, 1.4);
      tl.to("#rig", { rotationX: -TILT_VCR, duration: 2.6, ease: "power2.inOut" }, 1.4);
      // It tips back to lie flat as it reaches the slot: its face foreshortens to the top face
      // seen in frame 3, then hands over to frame 3's own tape.
      tl.to("#flyer", { x: -13, y: 86, rotationX: 64, scale: 1.03, duration: 2.6, ease: "power2.inOut" }, 1.4);
      tl.to("#flyer-b", { opacity: 1, duration: 0.25, ease: "none" }, 3.9);
      tl.to("#flyer", { opacity: 0, duration: 0.2, ease: "none" }, 4.0);
      tl.set("#flyer-b", { opacity: 0 }, 4.2);
      tl.set("#tape03", { opacity: 1, y: 16, scale: 1.02, transformOrigin: "50% 0%", filter: "brightness(1)" }, 4.2);
      tl.to("#tape03", { y: 0, scale: 1, duration: 0.6, ease: "power2.out" }, 4.2);
      tl.to("#tape03-shadow", { opacity: 1, duration: 1.0, ease: "power1.out" }, 3.8);

      // C. The tape slides into the slot; the flap closes behind it.
      // It travels back into the machine: it rises toward the slot and shrinks with distance
      // (scaled from its top edge, which sits on the slot's lip), darkening as it enters.
      tl.to("#tape03", { y: -232, scale: 0.84, filter: "brightness(0.55)", duration: 1.5, ease: "power2.inOut" }, 5.1);
      tl.to("#tape03-shadow", { opacity: 0, y: -24, duration: 0.8, ease: "power1.in" }, 5.1);
      tl.to("#vcr-closed", { opacity: 1, duration: 0.35, ease: "power1.inOut" }, 6.5);

      // D. The camera pivots down to the other wall, the TV.
      tl.to("#rig", { rotationX: -(TILT_VCR + TILT_TV), duration: 2.0, ease: "power2.inOut" }, 7.2);

      // E. Punch in on the screen until it fills the frame.
      tl.to(zoom, { z: 1, duration: 1.9, ease: "power2.inOut", modifiers: { z: (z) => applyZoom(+z) } }, 9.5);
      tl.to("#tv-screen", { opacity: 1, duration: 0.6, ease: "none" }, 10.6);
      tl.to("#tv-content", { opacity: 1, duration: 0.4, ease: "none" }, 11.5);
      tl.set({}, {}, 12);

      applyZoom(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
