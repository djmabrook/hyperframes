<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Proxy Media landing</title>
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.js",
          "three/addons/": "./assets/vendor/three/"
        }
      }
    </script>
    <link rel="stylesheet" href="scene.css" />
  </head>
  <body>
    <main
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <div id="world" data-layout-allow-overflow>
        <div class="shot" id="wall-shot"><img src="assets/img/wall.webp" alt="" /></div>
        <div class="shot" id="vcr-shot">
          <img src="assets/img/vcr-open.webp" alt="" /><img
            id="vcr-closed"
            src="assets/img/vcr-closed.webp"
            alt=""
          />
        </div>
        <div class="shot" id="tv-shot" data-layout-allow-overflow>
          <img src="assets/img/tv-wall.webp" alt="" />
        </div>
        <div id="tape-mask">
          <canvas id="tape-model"></canvas>
        </div>
      </div>
      <!-- A stable DOM surface for future site content, independent of the decorative player. -->
      <div id="screen-surface" data-placeholder="tba"></div>
    </main>
    <script src="scene.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.__proxyScene.timeline;
    </script>
    <script type="module" src="tape-model.js"></script>
    <script src="crt/crt-screen.js"></script>
  </body>
</html>
