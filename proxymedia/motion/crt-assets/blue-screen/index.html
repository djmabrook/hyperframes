<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VCR blue screen</title>
    <script src="assets/gsap-3.14.2.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: rgb(16, 40, 205);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- A VCR's own blue background with its on-screen display, as the signal.
         Loops seamlessly: every moving part completes whole cycles in 8 s. -->
    <main
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="signal" width="1920" height="1080"></canvas>
    </main>
    <script>
      (() => {
        const W = 1920,
          H = 1080,
          DURATION = 8,
          FPS = 30;
        const BLUE = [16, 40, 205];
        const TEXT = "by proxy";
        // VCR on-screen-display glyphs: a 5x9 dot matrix, rows 0-6 above the
        // baseline and 7-8 for descenders. Drawn as pixels, not from a font file.
        const GLYPHS = {
          b: ["X....", "X....", "XXXX.", "X...X", "X...X", "X...X", "XXXX.", ".....", "....."],
          y: [".....", ".....", "X...X", "X...X", "X...X", "X...X", ".XXXX", "....X", "XXXX."],
          p: [".....", ".....", "XXXX.", "X...X", "X...X", "X...X", "XXXX.", "X....", "X...."],
          r: [".....", ".....", "X.XXX", "XX...", "X....", "X....", "X....", ".....", "....."],
          o: [".....", ".....", ".XXX.", "X...X", "X...X", "X...X", ".XXX.", ".....", "....."],
          x: [".....", ".....", "X...X", ".X.X.", "..X..", ".X.X.", "X...X", ".....", "....."],
          " ": [".....", ".....", ".....", ".....", ".....", ".....", ".....", ".....", "....."],
        };
        const PX = 8; // one OSD dot, in output pixels
        const ADVANCE = 6 * PX; // 5 dots + 1 dot gap
        // Upper right, inside the 4:3 centre cut (x 240-1680) and its title-safe
        // margin, so it survives on the round-cornered tube.
        const TEXT_RIGHT = 1548;
        const TEXT_TOP = 112;
        const textLeft = TEXT_RIGHT - (TEXT.length * ADVANCE - PX);

        const ctx = document.getElementById("signal").getContext("2d");
        // The OSD is static on a real deck; draw it once and reuse it.
        const osd = document.createElement("canvas");
        osd.width = W;
        osd.height = H;
        (() => {
          const o = osd.getContext("2d");
          const dots = (dx, dy, color) => {
            o.fillStyle = color;
            [...TEXT].forEach((ch, i) => {
              GLYPHS[ch].forEach((row, y) =>
                [...row].forEach((cell, x) => {
                  if (cell === "X")
                    o.fillRect(textLeft + i * ADVANCE + x * PX + dx, TEXT_TOP + y * PX + dy, PX, PX);
                }),
              );
            });
          };
          // Dark keyed edge, like the black border a deck puts around its OSD.
          o.filter = "blur(2px)";
          dots(2, 2, "rgba(0,0,30,0.55)");
          // Bloom.
          o.filter = "blur(10px)";
          dots(0, 0, "rgba(200,215,255,0.55)");
          // Chroma bleed: luminance and colour don't line up on composite video.
          o.filter = "blur(1.2px)";
          dots(-2, 0, "rgba(255,120,160,0.35)");
          dots(2, 0, "rgba(120,220,255,0.35)");
          o.filter = "blur(0.6px)";
          dots(0, 0, "rgb(246,248,255)");
          o.filter = "none";
        })();

        function rng(seed) {
          let s = seed >>> 0 || 1;
          return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        }
        const noise = document.createElement("canvas");
        noise.width = 640;
        noise.height = 360;
        const nctx = noise.getContext("2d");
        function noiseFrame(seed) {
          const img = nctx.createImageData(640, 360);
          const r = rng(seed);
          for (let i = 0; i < img.data.length; i += 4) {
            const v = (r() - 0.5) * 120 + 128;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
          nctx.putImageData(img, 0, 0);
          return noise;
        }
        function renderAt(t) {
          t = ((t % DURATION) + DURATION) % DURATION;
          const frame = Math.round(t * FPS) % (DURATION * FPS);
          ctx.fillStyle = `rgb(${BLUE.join(",")})`;
          ctx.fillRect(0, 0, W, H);
          // Mains hum: one soft bright band rolls top to bottom per loop.
          const by = (t / DURATION) * (H + 600) - 300;
          const band = ctx.createLinearGradient(0, by - 300, 0, by + 300);
          band.addColorStop(0, "rgba(255,255,255,0)");
          band.addColorStop(0.5, "rgba(255,255,255,0.035)");
          band.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = band;
          ctx.fillRect(0, by - 300, W, 600);
          // Fine signal noise, never a clean plate.
          ctx.globalCompositeOperation = "overlay";
          ctx.globalAlpha = 0.09;
          ctx.drawImage(noiseFrame(frame + 101), 0, 0, W, H);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          // Tiny timebase wobble on the OSD, whole sine cycles per loop.
          const wob = 0.6 * Math.sin((t / DURATION) * Math.PI * 2 * 12);
          ctx.drawImage(osd, wob, 0);
          return t;
        }
        const clock = { time: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(
          clock,
          {
            time: DURATION,
            duration: DURATION,
            ease: "none",
            modifiers: { time: (v) => renderAt(Number(v)) },
          },
          0,
        );
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines.main = tl;
        window.__renderAt = renderAt;
      })();
    </script>
  </body>
</html>
