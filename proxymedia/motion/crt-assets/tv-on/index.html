<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>CRT power-on</title>
    <script src="assets/gsap-3.14.2.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- The signal the tube receives, not the tube: no curvature or glass here.
         motion/landing/crt/crt-screen.js adds those when it plays this file. -->
    <main
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="signal" width="1920" height="1080"></canvas>
    </main>
    <script>
      (() => {
        const W = 1920,
          H = 1080,
          DURATION = 2;
        // Ends on the exact blue that blue-screen/ starts on, so the cut is invisible.
        const BLUE = [16, 40, 205];
        const ctx = document.getElementById("signal").getContext("2d");
        const clamp = (v) => Math.max(0, Math.min(1, v));
        const ramp = (t, a, b) => clamp((t - a) / (b - a));
        const outExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
        // Seeded per frame so every render and every seek produces the same pixels.
        function rng(seed) {
          let s = seed >>> 0 || 1;
          return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        }
        const noise = document.createElement("canvas");
        noise.width = 480;
        noise.height = 270;
        const nctx = noise.getContext("2d");
        function noiseFrame(seed, amount) {
          const img = nctx.createImageData(480, 270);
          const r = rng(seed);
          for (let i = 0; i < img.data.length; i += 4) {
            const v = (r() - 0.5) * 255 * amount + 128;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
          nctx.putImageData(img, 0, 0);
          return noise;
        }
        function renderAt(t) {
          t = Math.max(0, Math.min(DURATION, t));
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);

          // 1. Beam warms up: a dim spot at the center.
          const spot = ramp(t, 0.0, 0.07) * (1 - ramp(t, 0.12, 0.2));
          // 2. Horizontal deflection: the line opens left/right.
          const lineW = outExpo(ramp(t, 0.06, 0.17));
          // 3. Vertical deflection: the line opens into the full raster.
          const open = outExpo(ramp(t, 0.17, 0.4));
          // 4. Overexposure settles into the picture.
          const settle = 1 - Math.exp(-Math.max(0, t - 0.36) / 0.22);
          // Two brief brightness pumps as the supply stabilises.
          const pump =
            0.18 * Math.exp(-(((t - 0.52) / 0.03) ** 2)) +
            0.1 * Math.exp(-(((t - 0.7) / 0.035) ** 2));

          if (spot > 0) {
            const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 60);
            g.addColorStop(0, `rgba(235,242,255,${spot})`);
            g.addColorStop(1, "rgba(235,242,255,0)");
            ctx.fillStyle = g;
            ctx.fillRect(W / 2 - 80, H / 2 - 80, 160, 160);
          }
          if (lineW > 0) {
            const h = 4 + (H - 4) * open;
            const w = W * lineW;
            const y = (H - h) / 2;
            // White-hot while thin, cooling to the signal colour as it fills.
            const heat = 1 - settle;
            const c = BLUE.map((b) => Math.round(b + (250 - b) * heat));
            const glow = (open < 1 ? 1 : 0) * (1 - open);
            ctx.shadowColor = `rgba(220,232,255,${0.9 * (1 - open * 0.8)})`;
            ctx.shadowBlur = 40 + 60 * glow;
            ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
            ctx.fillRect((W - w) / 2, y, w, h);
            ctx.shadowBlur = 0;
            // The leading edges of the opening raster are brightest.
            if (open > 0 && open < 1) {
              const e = ctx.createLinearGradient(0, y, 0, y + h);
              const a = 0.85 * (1 - open);
              e.addColorStop(0, `rgba(255,255,255,${a})`);
              e.addColorStop(0.08, "rgba(255,255,255,0)");
              e.addColorStop(0.92, "rgba(255,255,255,0)");
              e.addColorStop(1, `rgba(255,255,255,${a})`);
              ctx.fillStyle = e;
              ctx.fillRect((W - w) / 2, y, w, h);
            }
          }
          // Vertical hold catches once: a faint dark sync bar rolls through.
          const roll = ramp(t, 0.45, 1.05);
          if (roll > 0 && roll < 1) {
            const by = -220 + (H + 440) * roll;
            const bar = ctx.createLinearGradient(0, by - 160, 0, by + 160);
            bar.addColorStop(0, "rgba(0,0,0,0)");
            bar.addColorStop(0.5, `rgba(0,0,0,${0.22 * Math.sin(Math.PI * roll)})`);
            bar.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = bar;
            ctx.fillRect(0, by - 160, W, 320);
          }
          if (pump > 0.001 && open > 0) {
            ctx.fillStyle = `rgba(255,255,255,${pump})`;
            ctx.fillRect(0, 0, W, H);
          }
          // Analog signal noise, strongest while the set warms up.
          if (open > 0) {
            ctx.globalCompositeOperation = "overlay";
            ctx.globalAlpha = 0.1 + 0.25 * (1 - settle);
            ctx.drawImage(noiseFrame(Math.round(t * 30) + 7, 0.6), 0, 0, W, H);
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = "source-over";
          }
          return t;
        }
        const clock = { time: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(
          clock,
          {
            time: DURATION,
            duration: DURATION,
            ease: "none",
            modifiers: { time: (v) => renderAt(Number(v)) },
          },
          0,
        );
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines.main = tl;
        window.__renderAt = renderAt;
      })();
    </script>
  </body>
</html>
