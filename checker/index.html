<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d7fc0">
<title>Checker</title>
<link rel="modulepreload" href="vendor/three/three.module.js">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e85a78; }
  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: none; }
  .ctl { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 10px; z-index: 2; }
  .ctl button { width: 36px; height: 36px; padding: 7px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.0); color: #fff; mix-blend-mode: difference; opacity: 0.5; cursor: pointer; transition: opacity .4s; }
  .ctl button:hover, .ctl button:focus-visible { opacity: 0.95; outline: none; }
  .ctl button svg { width: 100%; height: 100%; display: block; }
  .ctl button .on { display: none; } .ctl button[aria-pressed="true"] .on { display: inline; } .ctl button[aria-pressed="true"] .off { display: none; }
  .ctl button.pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ctl button[hidden] { display: none; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .85 } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ctl">
  <button id="cam" aria-label="Head tracking" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle class="on" cx="12" cy="12" r="3" fill="currentColor"/><circle class="off" cx="12" cy="12" r="3"/>
    </svg>
  </button>
  <button id="tone" aria-label="Tone" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/>
    </svg>
  </button>
  <button id="snd" class="pulse" aria-label="Sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
      <g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g>
      <g class="off"><path d="M16 10l4 4M20 10l-4 4"/></g>
    </svg>
  </button>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
